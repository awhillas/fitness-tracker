[project]
name = "fitness-tracker"
version = "0.1.0"
description = "Simple web-app to track fitness activities"
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
    "alembic==1.20.0",
    "babel==2.18.0",
    "beautifulsoup4==4.15.0",
    "fastapi==0.142.2",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "playwright==1.63.0",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.4",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ty.environment]
python-version = "3.14"
