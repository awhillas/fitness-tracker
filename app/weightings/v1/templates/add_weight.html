{% extends "base.html" %}

{% block title %}Add weight &middot; {{ app_name }}{% endblock %}

{% block content %}
  <article>
    <h1>Add weight</h1>
    <form method="post" action="/weighings" hx-post="/weighings" hx-target="#add-result" hx-swap="outerHTML">
      <label for="date">Date
        <input type="date" id="date" name="date_value" lang="{{ html_lang }}" value="{{ today|iso_date }}" required />
      </label>
      <label for="weight_kg">Weight (kg)
        <input
          type="number"
          id="weight_kg"
          name="weight_kg"
          step="0.1"
          min="0"
          value="{{ weight if weight is not none else '' }}"
          placeholder="{{ weight|kg or 'first measurement' }}"
          required
        />
      </label>
      <button type="submit">Save weighing</button>
      <a href="/weighings" class="secondary">Cancel</a>
    </form>

    <div id="add-result">
      {% include "partials/add_result.html" %}
    </div>
  </article>
{% endblock %}
