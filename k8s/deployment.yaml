apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-tracker
  namespace: fitness
  labels:
    app: fitness-tracker
spec:
  # SQLite is single-writer: keep exactly one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fitness-tracker
  template:
    metadata:
      labels:
        app: fitness-tracker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: fitness-tracker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DB_PATH
              value: /data/fitness.db
            - name: TIMEZONE
              value: Pacific/Auckland
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fitness-tracker
                  key: secret_key
            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: fitness-tracker
                  key: username
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fitness-tracker
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fitness-tracker-data
        - name: tmp
          emptyDir: {}
