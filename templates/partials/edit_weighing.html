<tr id="weighing-{{ w.id }}" hx-swap="outerHTML">
  <td colspan="3">
    <form method="post" action="/weighings/{{ w.id }}" hx-put="/weighings/{{ w.id }}" hx-target="#weighing-{{ w.id }}" hx-swap="outerHTML">
      <label for="edit-date-{{ w.id }}">Date
        <input type="date" id="edit-date-{{ w.id }}" name="date_value" value="{{ w.date }}" required />
      </label>
      <label for="edit-weight-{{ w.id }}">Weight (kg)
        <input type="number" id="edit-weight-{{ w.id }}" name="weight_kg" step="0.1" min="0" value="{{ w.weight_kg }}" required />
      </label>
      {% if error %}
        <p class="error" role="alert">{{ error }}</p>
      {% endif %}
      <button type="submit">Save</button>
      <a href="/weighings" class="secondary">Cancel</a>
    </form>
  </td>
</tr>
